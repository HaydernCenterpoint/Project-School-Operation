name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build:web
      - run: pnpm build:mobile
      - run: pnpm test:mobile-client
      - run: pnpm test:config
      - run: pnpm test:accessibility
      - run: pnpm test:security
      - run: pnpm security:check
      - name: Scan git history with pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner
      - name: Reject committed local environment files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$'; then
            echo "Local environment file is tracked."
            exit 1
          fi

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm db:reset
      - run: pnpm db:test
      - run: pnpm db:lint
      - name: Upgrade populated 002 database to current
        run: ALLOW_LOCAL_DB_UPGRADE_SMOKE=1 pnpm db:upgrade-smoke
      - name: Backup and restore disposable local sandbox
        run: ALLOW_LOCAL_DB_RESTORE_SMOKE=1 pnpm db:restore-smoke
      - name: Run academic JWT/RLS integration flow
        shell: bash
        run: |
          eval "$(pnpm exec supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export ACADEMIC_API_URL="http://127.0.0.1:3210"
          export ACADEMIC_UI_URL="$ACADEMIC_API_URL"
          export AI_TUTOR_ENABLED="true"
          export AI_PROVIDER_URL="http://127.0.0.1:43210/v1/"
          export AI_PROVIDER_API_KEY="local-ci-placeholder"
          export AI_PROVIDER_ID="openai-compatible"
          export AI_PROVIDER_MODEL="citation-model-v1"
          export AI_PROVIDER_TIMEOUT_MS="150"

          pnpm build:web
          pnpm --filter web exec next start --hostname 127.0.0.1 --port 3210 \
            > /tmp/academic-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail "$ACADEMIC_API_URL/" > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/academic-next.log
              exit 1
            fi
            sleep 1
          done

          curl --silent --fail "$ACADEMIC_API_URL/" > /dev/null
          pnpm test:integration
          pnpm test:e2e:web

          # AI flow against the fake provider started inside the test.
          AI_ENABLED=true AI_PROVIDER=anthropic AI_MODEL=claude-haiku-4-5-20251001 AI_API_KEY=test-provider-key AI_API_BASE_URL=http://127.0.0.1:3999 pnpm --filter web exec next start --hostname 127.0.0.1 --port 3211 > /tmp/ai-next.log 2>&1 &
          ai_pid=$!
          trap 'kill "$server_pid" "$ai_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --silent --fail "http://127.0.0.1:3211/" > /dev/null && break
            sleep 1
          done
          ACADEMIC_API_URL="http://127.0.0.1:3211" AI_FAKE_PROVIDER_PORT=3999 pnpm test:ai
          pnpm security:check /tmp/academic-next.log /tmp/ai-next.log
