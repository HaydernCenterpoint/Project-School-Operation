name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build:web
      - run: pnpm build:mobile
      - run: pnpm test:mobile-client
      - run: pnpm test:config
      - run: pnpm test:accessibility
      - run: pnpm test:security
      - run: pnpm security:check
      - name: Scan git history with pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner
      - name: Reject committed local environment files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$'; then
            echo "Local environment file is tracked."
            exit 1
          fi

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm db:reset
      - run: pnpm db:test
      - run: pnpm db:lint
      - name: Upgrade populated 002 database to current
        run: ALLOW_LOCAL_DB_UPGRADE_SMOKE=1 pnpm db:upgrade-smoke
      - name: Backup and restore disposable local sandbox
        run: ALLOW_LOCAL_DB_RESTORE_SMOKE=1 pnpm db:restore-smoke
      - name: Run academic JWT/RLS integration flow
        shell: bash
        run: |
          eval "$(pnpm exec supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export ACADEMIC_API_URL="http://127.0.0.1:3210"
          export ACADEMIC_UI_URL="$ACADEMIC_API_URL"
          export AI_TUTOR_ENABLED="true"
          export AI_PROVIDER_URL="http://127.0.0.1:43210/v1/"
          export AI_PROVIDER_API_KEY="local-ci-placeholder"
          export AI_PROVIDER_ID="openai-compatible"
          export AI_PROVIDER_MODEL="citation-model-v1"
          export AI_PROVIDER_TIMEOUT_MS="150"

          reset_local_db() {
            pnpm db:reset

            auth_settings_status=""
            for attempt in {1..60}; do
              auth_settings_status="$(
                curl --silent --output /dev/null --write-out '%{http_code}' \
                  --connect-timeout 1 --max-time 2 \
                  --header "apikey: $SUPABASE_ANON_KEY" \
                  "$SUPABASE_URL/auth/v1/settings" || true
              )"

              case "$auth_settings_status" in
                200)
                  break
                  ;;
                000|5??)
                  sleep 1
                  ;;
                *)
                  echo "Supabase Auth settings probe failed with HTTP ${auth_settings_status:-unknown}."
                  return 1
                  ;;
              esac
            done

            if [ "$auth_settings_status" != "200" ]; then
              echo "Supabase Auth settings did not become ready after reset (last HTTP ${auth_settings_status:-unknown})."
              return 1
            fi

            auth_sign_in_status=""
            for attempt in {1..3}; do
              auth_sign_in_status="$(
                curl --silent --output /dev/null --write-out '%{http_code}' \
                  --connect-timeout 1 --max-time 2 \
                  --request POST \
                  --header "apikey: $SUPABASE_ANON_KEY" \
                  --header "Content-Type: application/json" \
                  --data '{"email":"student.a@saodo.test","password":"Password123!"}' \
                  "$SUPABASE_URL/auth/v1/token?grant_type=password" || true
              )"

              case "$auth_sign_in_status" in
                200)
                  return 0
                  ;;
                000|5??)
                  sleep 1
                  ;;
                *)
                  echo "Supabase Auth sign-in probe failed with HTTP ${auth_sign_in_status:-unknown}."
                  return 1
                  ;;
              esac
            done

            echo "Supabase Auth sign-in did not become ready after reset (last HTTP ${auth_sign_in_status:-unknown})."
            return 1
          }

          pnpm build:web
          pnpm --filter web exec next start --hostname 127.0.0.1 --port 3210 \
            > /tmp/academic-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail "$ACADEMIC_API_URL/" > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/academic-next.log
              exit 1
            fi
            sleep 1
          done

          curl --silent --fail "$ACADEMIC_API_URL/" > /dev/null
          reset_local_db
          pnpm test:ai-eval
          reset_local_db
          pnpm test:integration
          pnpm test:e2e:web
          pnpm security:check /tmp/academic-next.log

          reset_local_db
          export ACADEMIC_API_URL="http://127.0.0.1:3211"
          export AI_TUTOR_ENABLED="false"
          unset AI_PROVIDER_URL AI_PROVIDER_API_KEY AI_PROVIDER_ID AI_PROVIDER_MODEL
          pnpm --filter web exec next start --hostname 127.0.0.1 --port 3211 \
            > /tmp/academic-ai-off-next.log 2>&1 &
          off_server_pid=$!
          trap 'kill "$server_pid" "$off_server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail "$ACADEMIC_API_URL/" > /dev/null; then
              break
            fi
            if ! kill -0 "$off_server_pid" 2>/dev/null; then
              cat /tmp/academic-ai-off-next.log
              exit 1
            fi
            sleep 1
          done

          curl --silent --fail "$ACADEMIC_API_URL/" > /dev/null
          node --test tests/integration/academic-flow.test.mjs
          pnpm test:ai-off
          pnpm security:check /tmp/academic-ai-off-next.log
